<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="My contact details and links">
  <title>Chin Yong Wei | Connect</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: system-ui, sans-serif;
      background: #f1f5f9;
      color: #0f172a;
    }

    main {
      width: 100%;
      max-width: 420px;
      padding: 36px 24px;
      background: white;
      border-radius: 24px;
      text-align: center;
      box-shadow: 0 12px 40px rgb(15 23 42 / 8%);
    }

    .avatar {
      display: grid;
      place-items: center;
      width: 80px;
      height: 80px;
      margin: 0 auto 20px;
      border-radius: 50%;
      background: #dbeafe;
      color: #1d4ed8;
      font-size: 28px;
      font-weight: 700;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 28px;
    }

    p {
      margin: 0 0 28px;
      color: #475569;
      line-height: 1.6;
    }

    nav {
      display: grid;
      gap: 12px;
    }

    a {
      display: block;
      padding: 14px;
      border-radius: 12px;
      background: #0f172a;
      color: white;
      text-decoration: none;
      font-weight: 600;
    }

    a:hover {
      background: #334155;
    }

    a:focus-visible {
      outline: 3px solid #2563eb;
      outline-offset: 4px;
    }

    footer {
      margin-top: 24px;
      font-size: 13px;
      color: #64748b;
    }
  </style>
</head>

<body>
  <main>
    <div class="avatar" aria-hidden="true">YN</div>

    <h1>Chin Yong Wei</h1>
    <p>NUS Data Science Penultimate Undergraduate | Ex-Deutsche Bank | Ex-Shell.<br>Let's connect!</p>

    <nav aria-label="Contact and social links">
      <a href="mailto:chinyongwei@live.com">Email me</a>
      <a href="https://www.linkedin.com/in/chin-yong-wei/">
        LinkedIn
      </a>
      <a href="https://www.instagram.com/_yong.wei_/">
        Instagram
      </a>
      <a href="https://github.com/C-Yong-Wei">
        GitHub
      </a>
    </nav>

    <footer>Thanks for stopping by.</footer>
  </main>
</body>
</html>
